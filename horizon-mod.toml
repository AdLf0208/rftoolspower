id = "rftoolspower"
name = "RFTools Power"
version = "0.1.2"
description = """A port of RFTools Power for Horizon: the Coal Generator, which burns coal, charcoal or a
coal block for 600 ticks each (nine times that for a block) at 60 FE a tick into a 500,000 FE
buffer, lights its own front while it burns, takes fuel from a hopper or a right click, gives its
store out through the energy capability and pushes 2,000 FE a tick into an adjacent energy block;
the Power Monitor, which reads the block it faces every 20 ticks, shows its charge as a level
0-5, and gives a redstone alarm on its display side inside a configureable percentage band; and the
Powercell (tier 1 and tier 2), a 500,000 / 4,000,000 FE buffer whose six faces default to NONE and
take or give FE only through a face set to INPUT or OUTPUT, and whose adjacent cells share one
network — capacity and per-side throughput summed over every cell of it."""
authors = ["McJty", "Horizon native mod contributors"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside the carried data/ and assets/. The id is the resource namespace and the only identity:
# Cargo's package name and version are not the mod's.
api = "0.2"
# The installation side, not the hook's: an integrated server belongs to the client
# installation, so a single-player world and a LAN host need both.
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds" — the generator
# block and its item are carried content, and the code declares their block entity type.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
