id = "rftoolspower"
name = "RFTools Power"
version = "0.1.13"
description = """A port of RFTools Power for Horizon: the Coal Generator, which burns coal, charcoal or a
coal block for 600 ticks each (nine times that for a block) at 60 FE a tick into a 500,000 FE
buffer, lights its own front while it burns, takes fuel from a hopper or a right click, gives its
store out through the energy capability and pushes 2,000 FE a tick into an adjacent energy block,
charges an energy item in its second slot at 1,000 FE a tick out of its own store, and takes an
infusion carrier in a third slot whose int 0-256 component raises the rate to 60 + (long)(60*factor)
FE a tick and the burn to 600 + (int)(600*factor/2) ticks (upstream's infusable factor);
powercells'
own items answer the energy-item capability with the store they carry;
the Power Monitor, which reads the block it faces every 20 ticks, shows its charge as a level
0-5, and gives a redstone alarm on its display side inside a configureable percentage band; the
Powercell (tiers 1, 2 and 3), a 500,000 / 4,000,000 / 20,000,000 FE buffer whose six faces default to
NONE and take or give FE only through a face set to INPUT or OUTPUT (250 / 1,000 / 4,000 FE a tick a
side, plus 25 % per extra network cell), and whose adjacent cells share one network — capacity and
per-side throughput summed over every cell of it; and the Endergenic
Generator with its Pearl Injector: two linked generators, a pearl fired across the link, and the
5,000,000 FE buffer a pearl pays into when it lands inside the generator's 15-tick charging window
(200 FE to 25,600 FE depending on where in the window it hits), the pearl then held for 500 FE a
tick and fired again on the next redstone pulse; the Ender Monitor, whose mode (lost / fired /
arrived) decides which of those events it reports as a redstone pulse of 15 on its display face for
exactly one tick; and the Power Level, which reads the block it faces 20 ticks after placement and
then every 10 and gives stored * 10 / capacity (0 to 9) straight out of its display face; and the
Blazing Generator, four blazing-rod slots whose rods each climb a rate at a 150th of the gap a tick
up to their own 60 RF a tick (from a 60,000-quality rod), a 1,000,000 FE buffer, a 20,000 FE a tick
push into every neighbour, and the rod's whole state (quality, duration, agitation time, infusing
steps) kept in the mod's own `rftoolspower:blazing_rod_data` item component; and the Blazing
Agitator, a 3x3 box of rods whose quality and duration climb by the square of a factor built from
the neighbouring rods, whose agitation clock runs down, and whose finished rods move to one of nine
output slots unless their slot is locked, over a 50,000 FE buffer that takes 100 FE a tick and
spends 10; and the Blazing Infuser, which spends one catalyst and 10 FE a run on every 11th tick
to raise the input rod's quality and duration by the catalyst's percentage of a whole 64-step
stack (a nether star +120 %, redstone +40 % quality only), moves the rod to its output slot when
its last infusion step is used, and stores 50,000 FE; and the Dimensional Cell (simple / normal /
advanced / creative), a 250,000 / 1,000,000 / 4,000,000 FE buffer with six face modes whose
powercell card carries a typed channel id linking cells across distance into one shared store."""
authors = ["McJty", "Horizon native mod contributors"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside the carried data/ and assets/. The id is the resource namespace and the only identity:
# Cargo's package name and version are not the mod's.
api = "0.2"
# The installation side, not the hook's: an integrated server belongs to the client
# installation, so a single-player world and a LAN host need both.
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds" — the generator
# block and its item are carried content, and the code declares their block entity type.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
